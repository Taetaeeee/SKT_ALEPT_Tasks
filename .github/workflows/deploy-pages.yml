name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # ExchangeRate-API open data updates roughly once per day.
    # 00:30 UTC = 09:30 KST.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch current public exchange rates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 25 \
            'https://open.er-api.com/v6/latest/USD' \
            -o /tmp/t04-rates.json

          node T04_exchange_board/scripts/build-current-rates.mjs \
            /tmp/t04-rates.json \
            T04_exchange_board/data/current-rates.json

      - name: Preserve second actual KST-day record when eligible
        shell: bash
        run: |
          set -euo pipefail
          node T04_exchange_board/scripts/capture-second-live-record.mjs \
            /tmp/t04-rates.json \
            T04_exchange_board/data/live-records.json

      - name: Validate T04 source and evidence
        shell: bash
        run: |
          set -euo pipefail

          node --check T04_exchange_board/js/app.js
          node --check T04_exchange_board/js/calculators.js
          node --check T04_exchange_board/js/replay.js
          node --check T04_exchange_board/js/replay-core.js
          node --check T04_exchange_board/js/history.js
          node --check T04_exchange_board/js/live-records.js
          node --check T04_exchange_board/scripts/capture-second-live-record.mjs
          node --check T04_exchange_board/scripts/preflight.mjs

          node T04_exchange_board/scripts/preflight.mjs
          bash T04_exchange_board/scripts/scan-git-history-secrets.sh

      - name: Commit newly preserved second live record
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- T04_exchange_board/data/live-records.json; then
            echo 'No new live-day evidence to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add T04_exchange_board/data/live-records.json
          git commit -m 'chore(t04): preserve second live exchange-rate record'
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload repository as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
