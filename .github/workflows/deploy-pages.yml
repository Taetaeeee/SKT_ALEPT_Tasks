name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # ExchangeRate-API open data updates roughly once per day.
    # 00:30 UTC = 09:30 KST: fetch after the usual source refresh window.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6

      - name: Fetch current public exchange rates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 25 \
            'https://open.er-api.com/v6/latest/USD' \
            -o /tmp/t04-rates.json
          node T04_exchange_board/scripts/build-current-rates.mjs \
            /tmp/t04-rates.json \
            T04_exchange_board/data/current-rates.json

      - name: Validate T04 deployment files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            'T04_exchange_board/index.html'
            'T04_exchange_board/style.css'
            'T04_exchange_board/js/app.js'
            'T04_exchange_board/js/calculators.js'
            'T04_exchange_board/data/current-rates.json'
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          node --check T04_exchange_board/js/app.js
          node --check T04_exchange_board/js/calculators.js
          node -e "const s=require('./T04_exchange_board/data/current-rates.json'); if(!s.raw?.rates?.KRW||!s.raw?.rates?.JPY||!s.raw?.rates?.CNY) process.exit(1)"
          echo 'T04 required files validated.'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload repository as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
